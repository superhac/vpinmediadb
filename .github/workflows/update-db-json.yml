name: Update vpinmdb json file 

on:
  push:

  workflow_dispatch:

jobs:
  update-vpinmdb:
    runs-on: ubuntu-latest

   steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Clone vpinmediadb and list files
        run: |
          git clone --no-checkout --depth 1 https://github.com/superhac/vpinmediadb.git
          cd vpinmediadb
          git ls-tree --full-name --name-only -r HEAD > files.txt
          cat files.txt
      - name: Generate json file
        run: |
          BASE_URL="https://github.com/superhac/vpinmediadb/raw/refs/heads/main"
          declare -A files
          OUTPUT="vpinmdb.json"

          # Read input lines
          while IFS= read -r line; do
              [[ "$line" != *.png ]] && continue  # Skip non-.png files
              id="${line%%/*}"
              path="${line#*/}"
              key="$id|$path"
              files["$key"]="$BASE_URL/$line"
          done < files.txt

          # Get unique IDs
          ids=$(for k in "${!files[@]}"; do echo "$k" | cut -d'|' -f1; done | sort -u)

          # Start writing to the output file
          {
          echo "["

          first_id=1
          for id in $ids; do
              [[ $first_id -eq 0 ]] && echo ","
              first_id=0

              echo "  {"
              echo "    \"id\": \"$id\","

              declare -A resolutions
              wheel_url=""

              for k in "${!files[@]}"; do
                  this_id="${k%%|*}"
                  this_path="${k#*|}"
                  [[ "$this_id" == "$id" ]] || continue

                  IFS='/' read -ra parts <<< "$this_path"

                  if [[ "${parts[0]}" == "wheel.png" ]]; then
                      wheel_url="${files[$k]}"
                      continue
                  fi

                  if [[ "${parts[0]}" == "fss" ]]; then
                      res="${parts[1]}"
                      type="fss"
                  else
                      res="${parts[0]}"
                      type="${parts[1]%%.png}"
                  fi

                  resolutions["$res|$type"]="${files[$k]}"
              done

              res_keys=$(for k in "${!resolutions[@]}"; do echo "$k"; done | cut -d'|' -f1 | sort -u)

              for res in $res_keys; do
                  echo "    \"$res\": {"
                  first=1
                  for k in "${!resolutions[@]}"; do
                      r="${k%%|*}"
                      t="${k#*|}"
                      [[ "$r" == "$res" ]] || continue
                      [[ $first -eq 0 ]] && echo ","
                      echo -n "      \"$t\": \"${resolutions[$k]}\""
                      first=0
                  done
                  echo
                  echo "    },"
              done

              echo "    \"wheel\": \"${wheel_url}\""
              echo "  }"
          done

          echo "]"
          } > "$OUTPUT"

      - name: Upload vpinmdb json file
        uses: actions/upload-artifact@v4
        with:
          name: vpinmediadb
          path: vpinmdb.json

      - if: github.repository == 'superhac/vpinmediadb' && github.ref == 'refs/heads/main'
        name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vpinmdb.json
          git commit -m "vpinmediadb: regenerate vpinmdb.json"
          git push
      



